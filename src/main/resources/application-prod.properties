# Production Profile Configuration for PostgreSQL
spring.application.name=ResortsLite

# Server Configuration (from environment)
server.port=${SERVER_PORT:8080}

# PostgreSQL Database Configuration (Production - from environment/secrets)
spring.datasource.url=${DB_URL}
spring.datasource.username=${DB_USERNAME}
spring.datasource.password=${DB_PASSWORD}
spring.datasource.driver-class-name=org.postgresql.Driver

# JPA/Hibernate Configuration (Production)
spring.jpa.database-platform=org.hibernate.dialect.PostgreSQLDialect
spring.jpa.hibernate.ddl-auto=validate
spring.jpa.show-sql=false
spring.jpa.properties.hibernate.format_sql=false
spring.jpa.properties.hibernate.jdbc.lob.non_contextual_creation=true

# Production logging (minimal)
logging.level.root=INFO
logging.level.com.demo.resortslite=INFO

# Connection Pool Configuration (Production)
spring.datasource.hikari.maximum-pool-size=20
spring.datasource.hikari.minimum-idle=10
spring.datasource.hikari.connection-timeout=30000
spring.datasource.hikari.idle-timeout=600000
spring.datasource.hikari.max-lifetime=1800000

# Service Endpoints (Production - from environment)
app.payment.endpoint=${PAYMENT_ENDPOINT}
app.inventory.endpoint=${INVENTORY_ENDPOINT}
app.notification.endpoint=${NOTIFICATION_ENDPOINT}

# Report and Backup Paths (Production - from environment)
app.report.path=${REPORT_PATH:/app/reports/}
app.backup.path=${BACKUP_PATH:/app/backups/}
app.report.service.url=${REPORT_SERVICE_URL:https://reports.resorts.com}

# Security - Enable HTTPS in production
server.ssl.enabled=${SSL_ENABLED:false}
server.ssl.key-store=${SSL_KEYSTORE:}
server.ssl.key-store-password=${SSL_KEYSTORE_PASSWORD:}
server.ssl.key-store-type=${SSL_KEYSTORE_TYPE:PKCS12}
