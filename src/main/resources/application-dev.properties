# Development Profile Configuration for PostgreSQL
spring.application.name=ResortsLite

# Server Configuration
server.port=8080

# PostgreSQL Database Configuration (Development)
spring.datasource.url=jdbc:postgresql://localhost:5432/resortdb
spring.datasource.username=postgres
spring.datasource.password=postgres
spring.datasource.driver-class-name=org.postgresql.Driver

# JPA/Hibernate Configuration
spring.jpa.database-platform=org.hibernate.dialect.PostgreSQLDialect
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.format_sql=true
spring.jpa.properties.hibernate.jdbc.lob.non_contextual_creation=true

# Enable detailed logging for development
logging.level.org.hibernate.SQL=DEBUG
logging.level.org.hibernate.type.descriptor.sql.BasicBinder=TRACE
logging.level.org.springframework.jdbc.core=DEBUG

# Connection Pool Configuration
spring.datasource.hikari.maximum-pool-size=5
spring.datasource.hikari.minimum-idle=2
spring.datasource.hikari.connection-timeout=30000

# Service Endpoints (Development)
app.payment.endpoint=http://localhost:9090/charge
app.inventory.endpoint=http://localhost:8081/rooms
app.notification.endpoint=http://localhost:7070/send

# Report and Backup Paths (Development)
app.report.path=/tmp/reports/
app.backup.path=/tmp/backups/
app.report.service.url=http://localhost:8080
