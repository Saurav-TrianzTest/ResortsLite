# FIXED cr-java-0077: Hard-coded port replaced with environment variable injection
# Port configuration now supports AWS Parameter Store and dynamic assignment by ECS/EKS
# Set SERVER_PORT environment variable in your cloud deployment (ECS Task Definition, EKS ConfigMap, or Elastic Beanstalk)
# If SERVER_PORT is not set, falls back to server.port property, which defaults to 0 (random port assignment)
# For AWS deployment:
#   - ECS: Set SERVER_PORT in task definition environment variables
#   - EKS: Set SERVER_PORT in deployment manifest or ConfigMap
#   - Elastic Beanstalk: Set SERVER_PORT in environment properties
server.port=${SERVER_PORT:0}
# Must be externalised to AWS Parameter Store or Secrets Manager for cloud deployment.
spring.datasource.url=jdbc:h2:mem:resortdb;DB_CLOSE_DELAY=-1
spring.datasource.username=sa
spring.datasource.password=

spring.h2.console.enabled=true
spring.h2.console.path=/h2-console

# VIOLATION cr-java-0021 [Cloud Compatibility / Mandatory]: Hardcoded internal service endpoints.
# These hostnames are non-routable in cloud VPC environments without manual DNS configuration.
app.payment.endpoint=http://payment-svc.internal:9090/charge
app.inventory.endpoint=http://inventory-svc.internal:8081/rooms

# AWS S3 Configuration for Report Storage (FIXED cr-java-0061)
# Replace hard-coded file paths with cloud object storage
# Override these values using environment variables in cloud deployment
# FIXED cr-java-0065: Spring Session with Redis for distributed session management
# Replaces HTTP session storage with Amazon ElastiCache for Redis
# This enables stateless application instances with centralized session management
spring.session.store-type=redis
spring.session.redis.flush-mode=on_save
spring.session.redis.namespace=spring:session

# Redis connection configuration for AWS ElastiCache
# Override these values using environment variables in cloud deployment
spring.redis.host=${REDIS_HOST:localhost}
spring.redis.port=${REDIS_PORT:6379}
spring.redis.password=${REDIS_PASSWORD:}

# FIXED cr-java-0067: Redis cache configuration with TTL for distributed caching
# Replaces unbounded in-memory HashMap with Amazon ElastiCache for Redis
# Enables controlled expiration, consistent data across instances, and centralized cache management
spring.cache.type=redis
spring.cache.redis.time-to-live=3600000
# Cache names and their TTL (in milliseconds): bookingCache expires after 1 hour
spring.cache.cache-names=bookingCache
