# ResortsLite - Legacy Configuration
# VIOLATION cr-java-0021: Hardcoded infrastructure values in properties file
spring.application.name=ResortsLite

# FIXED cr-java-0077: Server port now uses environment variable for dynamic assignment
# AWS ECS, EKS, and Elastic Beanstalk can inject port via AWS Parameter Store
# Default to 8080 for local development if SERVER_PORT is not set
server.port=${SERVER_PORT:8080}

# VIOLATION cr-java-0021 [Cloud Compatibility / Mandatory]: Hardcoded DB hostname and credentials.
# Must be externalised to AWS Parameter Store or Secrets Manager for cloud deployment.
spring.datasource.url=jdbc:h2:mem:resortdb;DB_CLOSE_DELAY=-1
spring.datasource.username=sa
spring.datasource.password=

spring.h2.console.enabled=true
spring.h2.console.path=/h2-console

# VIOLATION cr-java-0021 [Cloud Compatibility / Mandatory]: Hardcoded internal service endpoints.
# These hostnames are non-routable in cloud VPC environments without manual DNS configuration.
app.payment.endpoint=http://payment-svc.internal:9090/charge
app.inventory.endpoint=http://inventory-svc.internal:8081/rooms
app.notification.endpoint=http://notify.internal:7070/send

# AWS S3 Configuration for Report Storage (replaces hard-coded file paths)
# These should be externalized to environment variables or AWS Parameter Store in production
aws.s3.bucket.name=${AWS_S3_BUCKET_NAME:resorts-lite-reports}

# Spring Session with Redis Configuration (Amazon ElastiCache for Redis)
# FIXED cr-java-0065: Migrated HTTP session storage to Amazon ElastiCache for Redis
# Enables stateless application instances with centralized, distributed session management
spring.session.store-type=redis
spring.session.redis.namespace=spring:session
spring.session.timeout=1800s

# FIXED cr-java-0090: AWS Secrets Manager Configuration for Database Credentials
# Replaces file-based and hardcoded authentication with cloud-native secrets management
# The secret should be stored in AWS Secrets Manager with the following JSON format:
# {"host": "db-host", "username": "db-user", "password": "db-password"}
aws.secretsmanager.secret-name=${AWS_SECRET_NAME:resorts-db-credentials}
aws.region=${AWS_REGION:us-east-1}

# FIXED cr-java-0067: Redis Cache TTL Configuration for Amazon ElastiCache
# Booking cache time-to-live in seconds (default: 1 hour)
app.cache.booking.ttl=${BOOKING_CACHE_TTL:3600}
