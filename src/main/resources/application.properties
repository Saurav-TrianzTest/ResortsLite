# ResortsLite - Legacy Configuration
# VIOLATION cr-java-0021: Hardcoded infrastructure values in properties file
spring.application.name=ResortsLite

# cr-java-0077 FIX: Server port externalised via AWS Systems Manager Parameter Store.
# Set the SERVER_PORT environment variable from SSM Parameter Store key /resortslite/server/port
# in your ECS task definition, EKS pod spec, or Elastic Beanstalk environment properties.
# Example SSM retrieval: aws ssm get-parameter --name /resortslite/server/port --with-decryption
server.port=${SERVER_PORT:8080}
# cr-java-0077: app.server.port mirrors server.port for injection into ReportService
app.server.port=${SERVER_PORT:8080}

# VIOLATION cr-java-0021 [Cloud Compatibility / Mandatory]: Hardcoded DB hostname and credentials.
# Must be externalised to AWS Parameter Store or Secrets Manager for cloud deployment.
spring.datasource.url=jdbc:h2:mem:resortdb;DB_CLOSE_DELAY=-1
spring.datasource.username=sa
spring.datasource.password=

spring.h2.console.enabled=true
spring.h2.console.path=/h2-console

# VIOLATION cr-java-0021 [Cloud Compatibility / Mandatory]: Hardcoded internal service endpoints.
# These hostnames are non-routable in cloud VPC environments without manual DNS configuration.
app.payment.endpoint=http://payment-svc.internal:9090/charge
app.inventory.endpoint=http://inventory-svc.internal:8081/rooms
app.notification.endpoint=http://notify.internal:7070/send

# -----------------------------------------------------------------------
# Amazon S3 configuration – cr-java-0061 (Hard-coded File Paths)
# All values are overridden at runtime via environment variables.
# -----------------------------------------------------------------------
# AWS region (override with AWS_REGION env var)
aws.region=${AWS_REGION:us-east-1}
# S3 bucket that stores generated reports (override with AWS_S3_REPORT_BUCKET env var)
aws.s3.report-bucket=${AWS_S3_REPORT_BUCKET:resorts-lite-reports}
# S3 key prefix for reports (override with AWS_S3_REPORT_PREFIX env var)
aws.s3.report-prefix=${AWS_S3_REPORT_PREFIX:reports/}
# S3 key prefix for nightly backups (override with AWS_S3_BACKUP_PREFIX env var)
aws.s3.backup-prefix=${AWS_S3_BACKUP_PREFIX:backups/nightly/}

# -----------------------------------------------------------------------
# AWS Secrets Manager configuration – cr-java-0069 (Hard-coded DB Credentials)
# Set DB_SECRET_NAME env var to the ARN or name of the secret in Secrets Manager.
# The secret must be a JSON object with "username" and "password" keys.
# -----------------------------------------------------------------------
aws.secretsmanager.db-secret-name=${DB_SECRET_NAME:resortslite/db/credentials}

# -----------------------------------------------------------------------
# Amazon Cognito configuration – cr-java-0090 (File-based Authentication)
# Authentication credentials and user data are no longer stored in local
# files or hardcoded in source code. User identity is managed entirely by
# Amazon Cognito User Pools. Set the following environment variables in
# your ECS task definition, EC2 launch template, or via a startup script
# that reads from AWS SSM Parameter Store:
#   aws ssm get-parameter --name /resortslite/cognito/user-pool-id --with-decryption
#   aws ssm get-parameter --name /resortslite/cognito/client-id    --with-decryption
# -----------------------------------------------------------------------
# Cognito User Pool ID (override with COGNITO_USER_POOL_ID env var)
# SSM Parameter Store key: /resortslite/cognito/user-pool-id
aws.cognito.user-pool-id=${COGNITO_USER_POOL_ID:}
# Cognito App Client ID (override with COGNITO_CLIENT_ID env var)
# SSM Parameter Store key: /resortslite/cognito/client-id
aws.cognito.client-id=${COGNITO_CLIENT_ID:}
# Cognito User Pool region (defaults to the shared aws.region property)
aws.cognito.region=${COGNITO_REGION:${AWS_REGION:us-east-1}}

# -----------------------------------------------------------------------
# Externalised environment URLs – cr-java-0071 (Hard-coded Environment URLs)
# All values are resolved from AWS Systems Manager Parameter Store at runtime
# via environment variables.  Set the env vars in your ECS task definition,
# EC2 launch template, or via a startup script that reads from SSM:
#   aws ssm get-parameter --name /resortslite/inventory/url --with-decryption
#   aws ssm get-parameter --name /resortslite/report/download-base-url --with-decryption
# -----------------------------------------------------------------------
# Inventory service URL (override with INVENTORY_SERVICE_URL env var)
# SSM Parameter Store key: /resortslite/inventory/url
app.inventory.url=${INVENTORY_SERVICE_URL:http://inventory-service.internal:8081/rooms/available}
# Report download base URL (override with REPORT_DOWNLOAD_BASE_URL env var)
# SSM Parameter Store key: /resortslite/report/download-base-url
app.report.download-base-url=${REPORT_DOWNLOAD_BASE_URL:https://reports.resorts-internal.com/download}

# -----------------------------------------------------------------------
# Spring Session + Amazon ElastiCache for Redis – cr-java-0065
# (HTTP Session State Storage)
# Instructs Spring Session to store all HttpSession data in Redis instead
# of the local JVM heap, enabling stateless instances and horizontal scaling.
#
# Required environment variables (set in ECS task definition, EC2 launch
# template, or via AWS SSM Parameter Store):
#   SPRING_REDIS_HOST  – ElastiCache primary endpoint hostname
#   SPRING_REDIS_PORT  – Redis port (default 6379)
#   SPRING_SESSION_REDIS_NAMESPACE – optional key namespace (default: spring:session)
# -----------------------------------------------------------------------
spring.session.store-type=redis
spring.session.redis.namespace=${SPRING_SESSION_REDIS_NAMESPACE:spring:session}
# ElastiCache Redis connection (override with env vars in cloud deployments)
spring.redis.host=${SPRING_REDIS_HOST:localhost}
spring.redis.port=${SPRING_REDIS_PORT:6379}
# Session timeout (default 30 minutes; override with SESSION_TIMEOUT_SECONDS env var)
spring.session.timeout=${SESSION_TIMEOUT_SECONDS:1800}s

# -----------------------------------------------------------------------
# Amazon ElastiCache for Redis – Booking Cache TTL – cr-java-0067
# (In-Memory Caching Without TTL)
# The former static HashMap bookingCache in BookingController has been
# replaced with Spring Data Redis (RedisTemplate) backed by Amazon
# ElastiCache for Redis.  Each booking cache entry is stored with an
# explicit TTL so that:
#   - Memory growth is bounded (entries expire automatically).
#   - All application instances share a single consistent cache view.
#   - Stale booking data is never served beyond the configured TTL.
#
# Set BOOKING_CACHE_TTL_SECONDS in your ECS task definition, EC2 launch
# template, or via AWS SSM Parameter Store:
#   aws ssm get-parameter --name /resortslite/booking/cache-ttl-seconds
# -----------------------------------------------------------------------
# Booking cache entry TTL in seconds (default: 3600 = 1 hour)
app.booking.cache.ttl-seconds=${BOOKING_CACHE_TTL_SECONDS:3600}
