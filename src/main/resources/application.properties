# ResortsLite - Cloud-Native Configuration
# All environment-specific values are externalised via environment variables.
# Set these variables in your ECS task definition, EKS pod spec, or Elastic Beanstalk environment.

spring.application.name=ResortsLite

# Server port is driven by the SERVER_PORT environment variable (blocker-12).
# ECS/EKS/Elastic Beanstalk inject this at runtime for dynamic port binding.
server.port=${SERVER_PORT:8080}

# -----------------------------------------------------------------------
# Database — credentials are managed by AWS Secrets Manager (blockers 8, 9).
# The BookingService retrieves host/username/password from Secrets Manager
# at runtime using the secret name defined in DB_SECRET_NAME env variable.
# -----------------------------------------------------------------------
spring.datasource.url=${DB_URL:jdbc:h2:mem:resortdb;DB_CLOSE_DELAY=-1}
spring.datasource.username=${DB_USERNAME:sa}
spring.datasource.password=${DB_PASSWORD:}

spring.h2.console.enabled=true
spring.h2.console.path=/h2-console

# -----------------------------------------------------------------------
# Spring Session — backed by Amazon ElastiCache for Redis (blockers 13-17).
# Enables stateless application instances with distributed session management.
# -----------------------------------------------------------------------
spring.session.store-type=redis
spring.session.redis.flush-mode=on-save
spring.session.redis.namespace=resortslite:session

# -----------------------------------------------------------------------
# Redis / ElastiCache connection (blockers 13-17, 20).
# Set REDIS_HOST and REDIS_PORT to your ElastiCache cluster endpoint.
# -----------------------------------------------------------------------
spring.redis.host=${REDIS_HOST:localhost}
spring.redis.port=${REDIS_PORT:6379}
spring.redis.password=${REDIS_PASSWORD:}
spring.redis.ssl=${REDIS_SSL:false}

# -----------------------------------------------------------------------
# AWS region — required by AWS SDK v2 clients (S3, SSM, Secrets Manager).
# -----------------------------------------------------------------------
aws.region=${AWS_REGION:us-east-1}

# -----------------------------------------------------------------------
# S3 bucket for report storage — replaces hard-coded /var/legacy/reports/ (blockers 1-7).
# -----------------------------------------------------------------------
reports.s3.bucket=${REPORTS_S3_BUCKET:resorts-reports-bucket}

# -----------------------------------------------------------------------
# Service endpoints — externalised; actual values stored in SSM Parameter Store.
# These properties serve as local fallbacks only (blockers 10, 11).
# -----------------------------------------------------------------------
app.payment.endpoint=${PAYMENT_API_URL:https://payment-svc.internal/charge}
app.inventory.endpoint=${INVENTORY_SERVICE_URL:https://inventory-service.internal/rooms/available}
app.notification.endpoint=${NOTIFICATION_SERVICE_URL:https://notify.internal/send}
