# ResortsLite - Cloud-Ready Configuration
spring.application.name=ResortsLite

# Server port - externalized to environment variable for cloud deployment
server.port=${SERVER_PORT:8080}

# Database configuration - externalized for cloud environments
spring.datasource.url=${DB_URL:jdbc:h2:mem:resortdb;DB_CLOSE_DELAY=-1}
spring.datasource.username=${DB_USERNAME:sa}
spring.datasource.password=${DB_PASSWORD:}

spring.h2.console.enabled=${H2_CONSOLE_ENABLED:false}
spring.h2.console.path=/h2-console

# AWS Configuration
aws.region=${AWS_REGION:us-east-1}
aws.s3.bucket.name=${S3_BUCKET_NAME:resorts-lite-reports}
aws.secrets.db.secret.name=${DB_SECRET_NAME:resorts-lite/db-credentials}

# Service endpoints - externalized to AWS Parameter Store
app.payment.endpoint=${PAYMENT_ENDPOINT:http://localhost:9090/charge}
app.inventory.endpoint=${INVENTORY_ENDPOINT:http://localhost:8081/rooms}
app.notification.endpoint=${NOTIFICATION_ENDPOINT:http://localhost:7070/send}

# Redis configuration for distributed session and cache (ElastiCache)
spring.redis.host=${REDIS_HOST:localhost}
spring.redis.port=${REDIS_PORT:6379}
spring.redis.password=${REDIS_PASSWORD:}
spring.redis.ssl=${REDIS_SSL:false}

# Spring Session configuration
spring.session.store-type=redis
spring.session.redis.namespace=resorts-lite:session
spring.session.timeout=1800

# Cache configuration
spring.cache.type=redis
spring.cache.redis.time-to-live=600000
spring.cache.redis.cache-null-values=false

# Timezone standardization - use UTC for all operations
spring.jackson.time-zone=UTC
spring.jackson.date-format=yyyy-MM-dd'T'HH:mm:ss.SSS'Z'
