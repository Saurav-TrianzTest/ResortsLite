# ResortsLite - Legacy Configuration
# VIOLATION cr-java-0021: Hardcoded infrastructure values in properties file
spring.application.name=ResortsLite

# ---------------------------------------------------------------------------
# cr-java-0065 remediation: Amazon ElastiCache for Redis — Spring Session
# ---------------------------------------------------------------------------
# Spring Session uses these properties to connect to the ElastiCache Redis
# cluster. Override via environment variables in ECS task definitions, EKS
# pod specs, or Elastic Beanstalk environment properties.
#
#   REDIS_HOST     — ElastiCache primary endpoint (e.g. my-cluster.abc123.ng.0001.use1.cache.amazonaws.com)
#   REDIS_PORT     — ElastiCache port (default 6379)
#   REDIS_PASSWORD — ElastiCache AUTH token (leave empty if AUTH is disabled)
#
# Local development defaults to a local Redis instance on localhost:6379.
spring.redis.host=${REDIS_HOST:localhost}
spring.redis.port=${REDIS_PORT:6379}
spring.redis.password=${REDIS_PASSWORD:}

# ---------------------------------------------------------------------------
# cr-java-0090 remediation: Amazon Cognito User Pool configuration
# ---------------------------------------------------------------------------
# Replaces file-based authentication credential storage with Amazon Cognito
# for centralized, encrypted, and auditable user identity management.
#
# Set these environment variables in your ECS task definition, EKS pod spec,
# or Elastic Beanstalk environment properties per environment:
#
#   COGNITO_USER_POOL_ID   — The Cognito User Pool ID (e.g. us-east-1_AbCdEfGhI)
#   COGNITO_APP_CLIENT_ID  — The Cognito App Client ID (no client secret required
#                            for ADMIN_USER_PASSWORD_AUTH flow)
#   AWS_REGION             — AWS region where the User Pool is deployed (e.g. us-east-1)
#
cognito.user-pool-id=${COGNITO_USER_POOL_ID:us-east-1_defaultPoolId}
cognito.app-client-id=${COGNITO_APP_CLIENT_ID:defaultAppClientId}

# Spring Session store type — Redis (cr-java-0065 remediation)
spring.session.store-type=redis
spring.session.redis.flush-mode=on-save
spring.session.redis.namespace=resortslite:session

# cr-java-0077 remediation: Server port is now injected at runtime via the SERVER_PORT
# environment variable. ECS task definitions, EKS pod specs, and Elastic Beanstalk
# environment properties set SERVER_PORT dynamically, enabling container orchestration
# platforms to assign ports without code changes. Falls back to 8080 for local development.
# To configure: set the SERVER_PORT environment variable in your ECS task definition,
# EKS pod spec (env section), or Elastic Beanstalk environment properties.
# AWS SSM Parameter Store fallback: /resortslite/server/port (see ReportService.resolveServerPort)
server.port=${SERVER_PORT:8080}

# VIOLATION cr-java-0021 [Cloud Compatibility / Mandatory]: Hardcoded DB hostname and credentials.
# Must be externalised to AWS Parameter Store or Secrets Manager for cloud deployment.
spring.datasource.url=jdbc:h2:mem:resortdb;DB_CLOSE_DELAY=-1
spring.datasource.username=sa
spring.datasource.password=

spring.h2.console.enabled=true
spring.h2.console.path=/h2-console

# VIOLATION cr-java-0021 [Cloud Compatibility / Mandatory]: Hardcoded internal service endpoints.
# These hostnames are non-routable in cloud VPC environments without manual DNS configuration.
app.payment.endpoint=http://payment-svc.internal:9090/charge
app.inventory.endpoint=http://inventory-svc.internal:8081/rooms
app.notification.endpoint=http://notify.internal:7070/send

# cr-java-0071 remediation: AWS SSM Parameter Store parameter names for environment-specific URLs.
# Set these environment variables to point to the correct SSM parameter paths per environment.
# The application reads the actual URL values from SSM Parameter Store at runtime.
# SSM_INVENTORY_URL_PARAM=/resortslite/inventory/service-url
# SSM_REPORT_DOWNLOAD_URL_PARAM=/resortslite/reports/download-base-url
# AWS_REGION=us-east-1
# SSM_SERVER_PORT_PARAM=/resortslite/server/port
# SERVER_PORT=8080
# Example SSM parameter values to configure in AWS:
#   /resortslite/inventory/service-url  = https://inventory-service.internal:8081/rooms/available
#   /resortslite/reports/download-base-url = https://reports.resorts-internal.com/download/
#   /resortslite/server/port = 8080
