# ResortsLite - Legacy Configuration
# VIOLATION cr-java-0021: Hardcoded infrastructure values in properties file
spring.application.name=ResortsLite

# cr-java-0067 FIX: In-memory HashMap cache replaced with Amazon ElastiCache for Redis.
# Spring Cache annotations (@Cacheable, @CachePut, @CacheEvict) on BookingController
# are backed by a RedisCacheManager configured in CacheConfig with per-cache TTL policies.
# This prevents unbounded memory growth, stale data, and cross-instance inconsistency.
#
# Cache TTL configuration (override via environment variables):
#   CACHE_TTL_BOOKINGS_MINUTES – TTL for the "bookings" cache in minutes (default: 30)
#
# The Redis connection used for caching reuses the same ElastiCache cluster configured
# below for Spring Session (SPRING_REDIS_HOST / SPRING_REDIS_PORT). No additional
# infrastructure is required — both Spring Session and Spring Cache share the same
# Redis connection factory auto-configured by Spring Boot.
spring.cache.type=redis

# cr-java-0065 FIX: Spring Session backed by Amazon ElastiCache for Redis.
# Setting store-type=redis instructs Spring Boot to auto-configure a
# RedisIndexedSessionRepository. All HTTP session state is stored in the
# shared Redis cluster, making every application instance stateless and
# enabling horizontal scaling behind an AWS ALB without server affinity.
#
# Required environment variables for AWS ElastiCache connectivity:
#   SPRING_REDIS_HOST – ElastiCache primary endpoint (e.g. my-cluster.abc123.ng.0001.use1.cache.amazonaws.com)
#   SPRING_REDIS_PORT – Redis port (default: 6379)
#   SPRING_REDIS_PASSWORD – Redis AUTH token (if in-transit encryption with AUTH is enabled)
#
# Session TTL is set to 30 minutes; adjust via SPRING_SESSION_TIMEOUT as needed.
spring.session.store-type=redis
spring.session.timeout=1800
spring.redis.host=${SPRING_REDIS_HOST:localhost}
spring.redis.port=${SPRING_REDIS_PORT:6379}
spring.redis.password=${SPRING_REDIS_PASSWORD:}
spring.redis.ssl=${SPRING_REDIS_SSL:false}

# cr-java-0069 FIX: DB credentials are no longer stored here or in source code.
# At runtime, set the following environment variables so BookingService can
# retrieve credentials from AWS Secrets Manager:
#   DB_SECRET_NAME  – name/ARN of the Secrets Manager secret (e.g. resortslite/db/credentials)
#   AWS_REGION      – AWS region where the secret is stored (default: us-east-1)
#   DB_HOST         – database hostname (externalised from hard-coded value)

# cr-java-0077 FIX: Hard-coded port 8080 (czr-port-001) has been removed from application logic.
# The server port is now resolved at runtime from AWS Systems Manager Parameter Store.
# Set the following environment variables in your ECS task definition, EKS pod spec,
# or Elastic Beanstalk environment configuration:
#   SSM_PARAM_SERVER_PORT – SSM parameter path for the port value
#                           (default: /resortslite/config/server-port)
#   SERVER_PORT           – fallback port used when SSM is unavailable (default: 8080)
# The SSM parameter /resortslite/config/server-port should be created in AWS SSM Parameter Store
# with the desired port value for each deployment environment (dev/staging/production).
server.port=${SERVER_PORT:8080}
SSM_PARAM_SERVER_PORT=/resortslite/config/server-port

# VIOLATION cr-java-0021 [Cloud Compatibility / Mandatory]: Hardcoded DB hostname and credentials.
# Must be externalised to AWS Parameter Store or Secrets Manager for cloud deployment.
spring.datasource.url=jdbc:h2:mem:resortdb;DB_CLOSE_DELAY=-1
spring.datasource.username=sa
spring.datasource.password=

spring.h2.console.enabled=true
spring.h2.console.path=/h2-console

# VIOLATION cr-java-0021 [Cloud Compatibility / Mandatory]: Hardcoded internal service endpoints.
# These hostnames are non-routable in cloud VPC environments without manual DNS configuration.
app.payment.endpoint=http://payment-svc.internal:9090/charge
app.inventory.endpoint=http://inventory-svc.internal:8081/rooms
app.notification.endpoint=http://notify.internal:7070/send

# cr-java-0071 FIX: AWS Systems Manager Parameter Store parameter names for environment-specific URLs.
# Each environment (dev, staging, production) stores its own URL value in SSM under these paths.
# No environment-specific URL is hard-coded in source code — only the SSM parameter path is here.
# Set AWS_REGION environment variable to the region where these SSM parameters are stored.
#   /resortslite/inventory/service-url  -> e.g. https://inventory-service.internal:8081/rooms/available
#   /resortslite/reports/download-base-url -> e.g. https://reports.resorts-internal.com/download/
ssm.param.inventory.url=/resortslite/inventory/service-url
ssm.param.report.download.url=/resortslite/reports/download-base-url
