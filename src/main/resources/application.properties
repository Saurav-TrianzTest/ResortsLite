# ResortsLite - Cloud-Ready Configuration
# All environment-specific values are externalised to environment variables
# which are populated from AWS SSM Parameter Store or AWS Secrets Manager
# at deploy time (ECS task definition / Elastic Beanstalk environment properties).

spring.application.name=ResortsLite

# ─── Server Port ──────────────────────────────────────────────────────────────
# Fix cr-java-0077: port is now injected from the SERVER_PORT environment variable
# (sourced from SSM Parameter Store /resortsLite/server/port).
# Default 8080 is used for local development only.
server.port=${SERVER_PORT:8080}

# ─── Database ─────────────────────────────────────────────────────────────────
# H2 in-memory database for local/test use.
# In production, override spring.datasource.url, username, and password via
# environment variables populated from AWS Secrets Manager
# (secret: resortsLite/db/credentials).
spring.datasource.url=${DB_URL:jdbc:h2:mem:resortdb;DB_CLOSE_DELAY=-1}
spring.datasource.username=${DB_USER:sa}
spring.datasource.password=${DB_PASS:}

spring.h2.console.enabled=true
spring.h2.console.path=/h2-console

# ─── Spring Session — Amazon ElastiCache for Redis ────────────────────────────
# Fix cr-java-0065: HTTP session state is now stored in Redis (ElastiCache).
# All cluster nodes share the same session store — no server affinity required.
spring.session.store-type=redis
spring.session.timeout=1800s

# Redis / ElastiCache connection.
# Set REDIS_HOST and REDIS_PORT environment variables from SSM Parameter Store:
#   /resortsLite/redis/host  →  REDIS_HOST
#   /resortsLite/redis/port  →  REDIS_PORT
spring.redis.host=${REDIS_HOST:localhost}
spring.redis.port=${REDIS_PORT:6379}

# ─── Spring Cache — Amazon ElastiCache for Redis (TTL-managed) ────────────────
# Fix cr-java-0067: in-memory HashMap cache replaced with Redis-backed Spring Cache.
# TTL of 600 seconds prevents unbounded memory growth and stale data across instances.
spring.cache.type=redis
spring.cache.redis.time-to-live=600000
spring.cache.redis.cache-null-values=false

# ─── AWS Configuration ────────────────────────────────────────────────────────
# AWS region for Secrets Manager, SSM Parameter Store, and S3 calls.
# Override with the AWS_REGION environment variable.
AWS_REGION=${AWS_REGION:us-east-1}

# ─── AWS Secrets Manager ──────────────────────────────────────────────────────
# Fix cr-java-0069 / cr-java-0090: secret name for DB credentials.
# Set DB_SECRET_NAME environment variable from SSM or task definition.
DB_SECRET_NAME=${DB_SECRET_NAME:resortsLite/db/credentials}

# ─── Amazon S3 — Report Storage ───────────────────────────────────────────────
# Fix cr-java-0061 / cr-java-0062 / cr-java-0063: S3 bucket and prefix replace
# hard-coded local file paths (/var/legacy/reports/, C:\ResortBackups\nightly\).
# Set REPORT_S3_BUCKET and REPORT_S3_PREFIX environment variables from SSM:
#   /resortsLite/reports/s3Bucket  →  REPORT_S3_BUCKET
#   /resortsLite/reports/s3Prefix  →  REPORT_S3_PREFIX
REPORT_S3_BUCKET=${REPORT_S3_BUCKET:resortsLite-reports}
REPORT_S3_PREFIX=${REPORT_S3_PREFIX:reports/}

# ─── Service Endpoints (externalised from SSM Parameter Store) ────────────────
# Fix cr-java-0071: all service URLs are injected from environment variables
# populated from AWS SSM Parameter Store at deploy time.
#   /resortsLite/inventory/serviceUrl  →  INVENTORY_SERVICE_URL
#   /resortsLite/payment/apiUrl        →  PAYMENT_API_URL
#   /resortsLite/reports/downloadBaseUrl → REPORT_DOWNLOAD_BASE_URL
app.inventory.service.url=${INVENTORY_SERVICE_URL:https://inventory-service.internal/rooms/available}
PAYMENT_API_URL=${PAYMENT_API_URL:https://payment-service.internal/payments/charge}
app.report.download.base.url=${REPORT_DOWNLOAD_BASE_URL:https://reports.resorts-internal.com/download}
