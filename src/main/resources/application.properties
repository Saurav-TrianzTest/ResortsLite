# ResortsLite - Legacy Configuration
# VIOLATION cr-java-0021: Hardcoded infrastructure values in properties file
spring.application.name=ResortsLite

# Externalized port for cloud container orchestration (cr-java-0077)
server.port=${PORT:8080}

# VIOLATION cr-java-0021 [Cloud Compatibility / Mandatory]: Hardcoded DB hostname and credentials.
# Must be externalised to AWS Parameter Store or Secrets Manager for cloud deployment.
spring.datasource.url=jdbc:h2:mem:resortdb;DB_CLOSE_DELAY=-1
spring.datasource.username=sa
spring.datasource.password=

spring.h2.console.enabled=true
spring.h2.console.path=/h2-console

# VIOLATION cr-java-0021 [Cloud Compatibility / Mandatory]: Hardcoded internal service endpoints.
# These hostnames are non-routable in cloud VPC environments without manual DNS configuration.
app.payment.endpoint=http://payment-svc.internal:9090/charge
app.inventory.endpoint=http://inventory-svc.internal:8081/rooms
app.notification.endpoint=http://notify.internal:7070/send

# --- Cloud Configuration ---
# S3 bucket for report storage (cr-java-0061, cr-java-0062, cr-java-0063)
app.s3.bucket=${APP_S3_BUCKET}
# Parameter Store path for environment configuration (cr-java-0071)
app.parameter.path=${APP_PARAMETER_PATH:/app/config/}
# Secrets Manager secret name for DB credentials (cr-java-0069)
app.db.secret.name=${DB_SECRET_NAME}

# --- Redis / ElastiCache Configuration ---
# Used for Spring Session Redis (cr-java-0065) and Redis cache (cr-java-0067)
spring.redis.host=${ELASTICACHE_ENDPOINT:localhost}
spring.redis.port=${REDIS_PORT:6379}
spring.redis.timeout=2000ms
spring.redis.connect-timeout=1000ms
spring.redis.lettuce.pool.max-active=20
spring.redis.lettuce.pool.max-idle=10
spring.redis.lettuce.pool.min-idle=5
spring.session.store-type=redis
spring.session.timeout=1800s
spring.session.redis.namespace=spring:session
spring.session.redis.flush-mode=on_save

# --- Safe Logging Configuration ---
# Prevent AWS SDK from logging secrets in wire/request logs
logging.level.software.amazon.awssdk=WARN
logging.level.software.amazon.awssdk.request=WARN
logging.level.org.apache.http.wire=WARN
logging.level.org.apache.http.headers=WARN
# Prevent Redis client from logging sensitive data
logging.level.redis.clients.jedis=WARN
logging.level.io.lettuce.core=WARN
logging.level.org.springframework.data.redis=WARN
