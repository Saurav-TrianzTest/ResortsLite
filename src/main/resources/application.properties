# =============================================================================
# ResortsLite - Cloud-Ready Configuration (AWS)
# All environment-specific values are injected via environment variables or
# AWS Systems Manager Parameter Store. No hard-coded credentials or URLs.
# =============================================================================

spring.application.name=ResortsLite

# -----------------------------------------------------------------------------
# Server Port — Blocker-12 (cr-java-0077)
# Hard-coded port replaced with environment variable injection.
# ECS / EKS / Elastic Beanstalk injects SERVER_PORT at runtime.
# -----------------------------------------------------------------------------
server.port=${SERVER_PORT:8080}

# -----------------------------------------------------------------------------
# Database — Blocker-8,9 (cr-java-0069)
# Credentials are NOT stored here. They are retrieved at runtime from
# AWS Secrets Manager (secret name: resortslite/db/credentials).
# The datasource URL uses the H2 in-memory DB for local development;
# in production, override via environment variables.
# -----------------------------------------------------------------------------
spring.datasource.url=${DB_URL:jdbc:h2:mem:resortdb;DB_CLOSE_DELAY=-1}
spring.datasource.username=${DB_USERNAME:sa}
spring.datasource.password=${DB_PASSWORD:}

spring.h2.console.enabled=true
spring.h2.console.path=/h2-console

# -----------------------------------------------------------------------------
# AWS Region & Secrets Manager — Blockers 8,9,18 (cr-java-0069, cr-java-0090)
# -----------------------------------------------------------------------------
cloud.aws.region.static=${AWS_REGION:us-east-1}
cloud.aws.secrets.db-credentials-secret-name=${DB_SECRET_NAME:resortslite/db/credentials}

# -----------------------------------------------------------------------------
# AWS S3 — Blockers 1-7 (cr-java-0061, cr-java-0062, cr-java-0063)
# Replaces all local file system paths with S3 bucket references.
# -----------------------------------------------------------------------------
cloud.aws.s3.report-bucket=${S3_REPORT_BUCKET:resorts-lite-reports}
cloud.aws.s3.report-prefix=${S3_REPORT_PREFIX:reports/}

# -----------------------------------------------------------------------------
# AWS SSM Parameter Store — Blockers 10,11,12 (cr-java-0071, cr-java-0077)
# Environment-specific URLs and port config are stored in Parameter Store.
# -----------------------------------------------------------------------------
cloud.aws.ssm.payment-api-param=${PAYMENT_API_PARAM:/resortslite/payment/api-url}

# Service endpoints resolved from SSM Parameter Store at runtime.
# Blocker-10 (cr-java-0071): inventory URL externalized
app.inventory.endpoint=${INVENTORY_SERVICE_URL:http://inventory-service.internal:8081/rooms/available}
# Blocker-11 (cr-java-0071): report download base URL externalized
app.report.download-base-url=${REPORT_DOWNLOAD_BASE_URL:https://reports.resorts-internal.com/download}
# Blocker-12 (cr-java-0077): payment endpoint externalized
app.payment.endpoint=${PAYMENT_SERVICE_URL:https://payment-svc.internal/payments/charge}
app.notification.endpoint=${NOTIFICATION_SERVICE_URL:https://notify.internal/send}

# -----------------------------------------------------------------------------
# Amazon ElastiCache for Redis — Spring Session (Blockers 13-17, cr-java-0065)
# HTTP session state is stored in distributed Redis (ElastiCache) so that all
# application instances share session data, enabling stateless horizontal scaling.
# -----------------------------------------------------------------------------
spring.redis.host=${REDIS_HOST:localhost}
spring.redis.port=${REDIS_PORT:6379}
spring.redis.password=${REDIS_PASSWORD:}
spring.redis.ssl=${REDIS_SSL:false}

# Spring Session: use Redis as the session store
spring.session.store-type=redis
spring.session.redis.flush-mode=on-save
spring.session.redis.namespace=resortslite:session

# -----------------------------------------------------------------------------
# Amazon ElastiCache for Redis — Booking Cache (Blocker-20, cr-java-0067)
# Unbounded in-memory HashMap replaced with Redis-backed cache with TTL.
# TTL is enforced per entry in BookingController (30 minutes default).
# -----------------------------------------------------------------------------
spring.cache.type=redis
spring.cache.redis.time-to-live=1800000
