# ResortsLite - Containerized Configuration
spring.application.name=ResortsLite

# Server port - externalized for container orchestration
server.port=${SERVER_PORT:8080}

# Database configuration - externalized
spring.datasource.url=${DB_URL:jdbc:h2:mem:resortdb;DB_CLOSE_DELAY=-1}
spring.datasource.username=${DB_USERNAME:sa}
spring.datasource.password=${DB_PASSWORD:}

spring.h2.console.enabled=true
spring.h2.console.path=/h2-console

# Redis configuration for distributed sessions and caching
spring.redis.host=${REDIS_HOST:localhost}
spring.redis.port=${REDIS_PORT:6379}
spring.redis.password=${REDIS_PASSWORD:}
spring.session.store-type=redis
spring.session.redis.namespace=resortslite:session

# AWS S3 configuration for file storage
aws.s3.bucket-name=${S3_BUCKET_NAME:resortslite-reports}
aws.s3.region=${AWS_REGION:us-east-1}

# External service endpoints - externalized
app.payment.endpoint=${PAYMENT_ENDPOINT:http://payment-svc.internal:9090/charge}
app.inventory.endpoint=${INVENTORY_ENDPOINT:http://inventory-svc.internal:8081/rooms}
app.notification.endpoint=${NOTIFICATION_ENDPOINT:http://notify.internal:7070/send}

# Actuator health check configuration
management.endpoints.web.exposure.include=health,info
management.endpoint.health.show-details=when-authorized
management.health.redis.enabled=true
