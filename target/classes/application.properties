# ResortsLite - Legacy Configuration
# VIOLATION cr-java-0021: Hardcoded infrastructure values in properties file
spring.application.name=ResortsLite

# VIOLATION czr-port-001 [Software Portability]: Fixed port prevents dynamic assignment by ECS/EKS
server.port=8080

# VIOLATION cr-java-0021 [Cloud Compatibility / Mandatory]: Hardcoded DB hostname and credentials.
# Must be externalised to AWS Parameter Store or Secrets Manager for cloud deployment.
spring.datasource.url=jdbc:h2:mem:resortdb;DB_CLOSE_DELAY=-1
spring.datasource.username=sa
spring.datasource.password=

spring.h2.console.enabled=true
spring.h2.console.path=/h2-console

# VIOLATION cr-java-0021 [Cloud Compatibility / Mandatory]: Hardcoded internal service endpoints.
# These hostnames are non-routable in cloud VPC environments without manual DNS configuration.
app.payment.endpoint=http://payment-svc.internal:9090/charge
app.inventory.endpoint=http://inventory-svc.internal:8081/rooms
app.notification.endpoint=http://notify.internal:7070/send

# File path environment variable defaults (cz-java-0057)
# Override REPORT_BASE_PATH and BACKUP_PATH via Kubernetes ConfigMap / environment variables
REPORT_BASE_PATH=/var/reports
BACKUP_PATH=/var/backups

# cz-java-0070: Cache TTL for Amazon ElastiCache (Redis) booking cache entries.
# Override CACHE_TTL_SECONDS via Kubernetes ConfigMap to tune cache expiry per environment.
CACHE_TTL_SECONDS=3600

# Health check endpoint via Spring Boot Actuator (health-check-endpoint)
management.endpoints.web.exposure.include=health
management.endpoint.health.show-details=always
management.endpoints.web.base-path=/actuator

# cz-java-0063: Spring Session + Amazon ElastiCache (Redis) configuration.
# REDIS_HOST and REDIS_PORT are injected at runtime via Kubernetes Secret / ConfigMap
# so no credentials or hostnames are baked into the container image.
# In EKS the pod's IRSA role controls network access to the ElastiCache cluster.
spring.redis.host=${REDIS_HOST:localhost}
spring.redis.port=${REDIS_PORT:6379}
# Use Redis as the Spring Session store (activated by @EnableRedisHttpSession in RedisSessionConfig)
spring.session.store-type=redis
# Session timeout: 30 minutes (matches maxInactiveIntervalInSeconds in RedisSessionConfig)
spring.session.timeout=1800s
