# ResortsLite - Legacy Configuration
# VIOLATION cr-java-0021: Hardcoded infrastructure values in properties file
spring.application.name=ResortsLite

# VIOLATION czr-port-001 [Software Portability]: Fixed port prevents dynamic assignment by ECS/EKS
server.port=8080

# VIOLATION cr-java-0021 [Cloud Compatibility / Mandatory]: Hardcoded DB hostname and credentials.
# Must be externalised to AWS Parameter Store or Secrets Manager for cloud deployment.
spring.datasource.url=jdbc:h2:mem:resortdb;DB_CLOSE_DELAY=-1
spring.datasource.username=sa
spring.datasource.password=

spring.h2.console.enabled=true
spring.h2.console.path=/h2-console

# VIOLATION cr-java-0021 [Cloud Compatibility / Mandatory]: Hardcoded internal service endpoints.
# These hostnames are non-routable in cloud VPC environments without manual DNS configuration.
app.payment.endpoint=http://payment-svc.internal:9090/charge
app.inventory.endpoint=http://inventory-svc.internal:8081/rooms
app.notification.endpoint=http://notify.internal:7070/send

# Health check endpoint configuration (health-check-endpoint)
# Spring Boot Actuator exposes /actuator/health for container liveness/readiness probes
management.endpoints.web.exposure.include=health
management.endpoint.health.show-details=always
management.health.defaults.enabled=true

# cz-java-0069 FIX: In-Memory Session Storage — ALB Session Affinity Transitional Strategy
# Configure Spring Boot session cookie to align with ALB sticky session (AWSALB cookie).
# The ALB Target Group must have stickiness enabled (lb_cookie, duration=86400s).
# This ensures the same ECS Fargate task replica handles all requests for a given client
# during the transitional period before full Redis/ElastiCache session migration.
server.servlet.session.cookie.name=JSESSIONID
server.servlet.session.cookie.http-only=true
server.servlet.session.cookie.secure=true
server.servlet.session.timeout=1d
# ALB sticky session duration must match or exceed the session timeout above.
# Set TargetGroup StickinessEnabled=true, StickinessType=lb_cookie, StickinessDuration=86400
