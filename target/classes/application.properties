# ResortsLite - Legacy Configuration
# VIOLATION cr-java-0021: Hardcoded infrastructure values in properties file
spring.application.name=ResortsLite

# VIOLATION czr-port-001 [Software Portability]: Fixed port prevents dynamic assignment by ECS/EKS
server.port=8080

# VIOLATION cr-java-0021 [Cloud Compatibility / Mandatory]: Hardcoded DB hostname and credentials.
# Must be externalised to AWS Parameter Store or Secrets Manager for cloud deployment.
spring.datasource.url=jdbc:h2:mem:resortdb;DB_CLOSE_DELAY=-1
spring.datasource.username=sa
spring.datasource.password=

spring.h2.console.enabled=true
spring.h2.console.path=/h2-console

# VIOLATION cr-java-0021 [Cloud Compatibility / Mandatory]: Hardcoded internal service endpoints.
# These hostnames are non-routable in cloud VPC environments without manual DNS configuration.
app.payment.endpoint=http://payment-svc.internal:9090/charge
app.inventory.endpoint=http://inventory-svc.internal:8081/rooms
app.notification.endpoint=http://notify.internal:7070/send

# cz-java-0082 FIX: ECS Service Connect endpoints for decoupled inter-service communication.
# These properties replace hardcoded inter-service URLs in BookingController (Line 84) and
# BookingService (Line 102). In ECS Fargate, set the corresponding environment variables in
# the task definition to the ECS Service Connect DNS names for each service.
# ECS Service Connect provides automatic service discovery, mTLS, and traffic observability.
#
# Payment service (replaces hardcoded "http://10.0.1.45:9090/payments/charge"):
#   Set PAYMENT_SERVICE_ENDPOINT to the ECS Service Connect DNS name, e.g. http://payment-service:9090
payment.service.endpoint=${PAYMENT_SERVICE_ENDPOINT:http://payment-service:9090}
#
# Inventory service (replaces hardcoded "http://inventory-service.internal:8081/rooms/available"):
#   Set INVENTORY_SERVICE_ENDPOINT to the ECS Service Connect DNS name, e.g. http://inventory-service:8081
inventory.service.endpoint=${INVENTORY_SERVICE_ENDPOINT:http://inventory-service:8081}

# cz-java-0057 FIX: EFS-backed mount paths for persistent file storage in ECS Fargate.
# Override APP_REPORT_BASE_PATH and APP_BACKUP_PATH environment variables in the ECS task
# definition to point to the EFS volume mount points configured for the task.
app.report.base-path=${APP_REPORT_BASE_PATH:/mnt/efs/reports}
app.backup.path=${APP_BACKUP_PATH:/mnt/efs/backups}

# Health check endpoint (Spring Boot Actuator)
management.endpoints.web.exposure.include=health
management.endpoint.health.show-details=always

# cz-java-0063 FIX: JWT signing secret for stateless authentication replacing HttpSession.
# In ECS Fargate, inject JWT_SECRET from AWS Secrets Manager via the task definition
# environment variables. Never hardcode this value in source control.
jwt.secret=${JWT_SECRET:changeme-override-in-production}

# cz-java-0069 FIX: ALB Target Group Stickiness — Transitional Strategy for In-Memory Session Storage.
# Enable ALB lb_cookie sticky sessions so that a given user's requests are consistently routed
# to the same ECS Fargate task while the full Redis-backed distributed session migration is completed.
# Set these environment variables in the ECS Fargate task definition:
#   ALB_STICKINESS_ENABLED           = true
#   ALB_STICKINESS_DURATION_SECONDS  = 86400  (24 hours; tune per environment)
alb.stickiness.enabled=${ALB_STICKINESS_ENABLED:true}
alb.stickiness.duration-seconds=${ALB_STICKINESS_DURATION_SECONDS:86400}

# cz-java-0070 FIX: Amazon ElastiCache for Memcached — Distributed Cache Configuration.
# Replaces the local in-memory HashMap cache (Line 19 in original BookingController.java)
# that was instance-local and invisible to other ECS Fargate tasks during horizontal scaling.
#
# MEMCACHED_ENDPOINT: ElastiCache cluster configuration endpoint, e.g.:
#   my-cluster.abc123.cfg.use1.cache.amazonaws.com:11211
# Store this value in AWS SSM Parameter Store (e.g. /resortsLite/cache/endpoint) and
# reference it in the ECS Fargate task definition via valueFrom (SSM parameter ARN).
#
# CACHE_TTL_SECONDS: Cache entry TTL in seconds (default: 3600 = 1 hour).
memcached.endpoint=${MEMCACHED_ENDPOINT:localhost:11211}
cache.ttl.seconds=${CACHE_TTL_SECONDS:3600}
