# ResortsLite - Legacy Configuration
# VIOLATION cr-java-0021: Hardcoded infrastructure values in properties file
spring.application.name=ResortsLite

# VIOLATION czr-port-001 [Software Portability]: Fixed port prevents dynamic assignment by ECS/EKS
server.port=8080

# VIOLATION cr-java-0021 [Cloud Compatibility / Mandatory]: Hardcoded DB hostname and credentials.
# Must be externalised to AWS Parameter Store or Secrets Manager for cloud deployment.
spring.datasource.url=jdbc:h2:mem:resortdb;DB_CLOSE_DELAY=-1
spring.datasource.username=sa
spring.datasource.password=

spring.h2.console.enabled=true
spring.h2.console.path=/h2-console

# VIOLATION cr-java-0021 [Cloud Compatibility / Mandatory]: Hardcoded internal service endpoints.
# These hostnames are non-routable in cloud VPC environments without manual DNS configuration.
app.payment.endpoint=http://payment-svc.internal:9090/charge
app.inventory.endpoint=http://inventory-svc.internal:8081/rooms
app.notification.endpoint=http://notify.internal:7070/send

# blocker-4/5/6/7/8 (cz-java-0063, cz-java-0069): Spring Session Redis configuration for
# Amazon ElastiCache. SPRING_REDIS_HOST and SPRING_REDIS_PORT are injected via environment
# variables in ECS/EKS task definitions, replacing in-memory session storage.
spring.redis.host=${SPRING_REDIS_HOST:localhost}
spring.redis.port=${SPRING_REDIS_PORT:6379}
spring.session.store-type=redis
spring.session.redis.flush-mode=on-save
spring.session.redis.namespace=spring:session

# blocker-12 (cz-java-0062): Payment API URL externalised via environment variable,
# replacing hardcoded IP address 10.0.1.45 for flexible container deployment.
PAYMENT_API_URL=${PAYMENT_API_URL:http://payment-service/payments/charge}

# blocker-2/3 (cz-java-0057): S3 bucket names externalised via environment variables,
# replacing hardcoded absolute filesystem paths for container portability.
S3_REPORTS_BUCKET=${S3_REPORTS_BUCKET:resorts-reports-bucket}
S3_BACKUP_BUCKET=${S3_BACKUP_BUCKET:resorts-backup-bucket}

# blocker-11 (cz-java-0061): Server port externalised via environment variable for
# dynamic port binding in ECS/EKS container deployments.
SERVER_PORT=${SERVER_PORT:8080}

# blocker-9 (cz-java-0082): Report service URL externalised via environment variable
# for decoupled microservice communication via AWS App Mesh and API Gateway.
REPORT_SERVICE_URL=${REPORT_SERVICE_URL:http://report-service/api/reports}

# Health check endpoint: Spring Boot Actuator /actuator/health exposed for container
# liveness and readiness probes in ECS/EKS deployments.
management.endpoints.web.exposure.include=health,info
management.endpoint.health.show-details=always
