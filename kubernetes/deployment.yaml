apiVersion: apps/v1
kind: Deployment
metadata:
  name: bookingcomp
  namespace: bookingcomp
  labels:
    app: bookingcomp
    version: "1.0.0"
spec:
  replicas: 2
  selector:
    matchLabels:
      app: bookingcomp
  template:
    metadata:
      labels:
        app: bookingcomp
        version: "1.0.0"
    spec:
      containers:
        - name: bookingcomp
          image: "{{IMAGE_URI}}"
          imagePullPolicy: Always
          ports:
            - name: http
              containerPort: 8080
              protocol: TCP
          env:
            - name: SPRING_PROFILES_ACTIVE
              value: "docker"
            - name: TZ
              value: "UTC"
            - name: JAVA_OPTS
              value: "-Xms256m -Xmx512m -XX:+UseContainerSupport -XX:MaxRAMPercentage=75.0 -Djava.security.egd=file:/dev/./urandom"
            - name: SERVER_PORT
              value: "8080"
            # Redis / Amazon ElastiCache
            - name: SPRING_REDIS_HOST
              value: "{{SPRING_REDIS_HOST}}"
            - name: SPRING_REDIS_PORT
              value: "{{SPRING_REDIS_PORT}}"
            # External service endpoints
            - name: PAYMENT_API_URL
              value: "{{PAYMENT_API_URL}}"
            - name: REPORT_SERVICE_URL
              value: "{{REPORT_SERVICE_URL}}"
            # S3 bucket names
            - name: S3_REPORTS_BUCKET
              value: "{{S3_REPORTS_BUCKET}}"
            - name: S3_BACKUP_BUCKET
              value: "{{S3_BACKUP_BUCKET}}"
          resources:
            requests:
              cpu: "250m"
              memory: "512Mi"
            limits:
              cpu: "500m"
              memory: "1Gi"
          livenessProbe:
            httpGet:
              path: /actuator/health
              port: 8080
            initialDelaySeconds: 60
            periodSeconds: 30
            timeoutSeconds: 10
            failureThreshold: 3
          readinessProbe:
            httpGet:
              path: /actuator/health
              port: 8080
            initialDelaySeconds: 30
            periodSeconds: 15
            timeoutSeconds: 5
            failureThreshold: 3
      terminationGracePeriodSeconds: 30
